name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify the tag matches the project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties version $VERSION" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/')

      - name: Build and test
        run: ./gradlew ktlintCheck test

      - name: Publish
        run: ./gradlew publishAllPublicationsToMavenCentralRepository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

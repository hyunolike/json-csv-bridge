name: JitPack Release

# 태그 릴리스는 release.yml 이 담당한다. 여기는 예전부터 쓰던 release 브랜치 빌드만 남긴다.
on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build

      # JitPack 은 자체 서버에서 태그를 빌드하므로 여기서 아티팩트를 올리지 않는다.
      # 아래 요청은 그 빌드를 미리 깨워 첫 사용자가 기다리지 않게 하는 용도다.
      - name: Notify JitPack
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Notifying JitPack about the new release..."
          curl -X POST https://jitpack.io/api/builds/${{ github.repository }}/commits/${{ github.sha }}


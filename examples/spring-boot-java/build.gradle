plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 오픈소스 프로젝트 추가
	// Add open-source project
	implementation 'io.github.hyunolike:json-csv-bridge:2.2.0'

	// Spring Boot 라면 스타터를 쓰는 방법도 있다. 변환기가 빈으로 자동 등록된다.
	// implementation 'io.github.hyunolike:json-csv-bridge-spring-boot-starter:2.2.0'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
